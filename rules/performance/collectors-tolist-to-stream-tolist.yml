id: collectors-tolist-to-stream-tolist
language: java
severity: warning
message: >-
  Use Stream.toList() instead of .collect(Collectors.toList()). It's
  shorter and, since Java 16, the standard idiom for materializing a
  stream into a list. Caveat: Stream.toList() returns an unmodifiable
  list, so keep Collectors.toList() if the caller needs to mutate the
  result (or wrap it in new ArrayList<>(...)).
metadata:
  category: performance
rule:
  any:
    - pattern: $STREAM.collect(Collectors.toList())
    - pattern: $STREAM.collect(java.util.stream.Collectors.toList())

id: or-else-eager-default
language: java
severity: warning
message: >-
  Optional.orElse(...) evaluates its argument eagerly, so a constructor
  default runs even when the Optional is present. Use orElseGet(() -> ...),
  or orElseThrow(), to compute the fallback only when it is actually
  needed. (Only constructor defaults are flagged; a cheap method call like
  OptionalInt.empty() or a getter is left alone.)
metadata:
  category: performance
rule:
  pattern: $OPT.orElse($ARG)
  has:
    field: arguments
    has:
      kind: object_creation_expression
      stopBy: end

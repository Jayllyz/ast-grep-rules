id: no-lombok-data-on-entity
language: java
severity: warning
message: >-
  Lombok @Data (and a bare @EqualsAndHashCode) generates equals/hashCode
  from every field, including lazy JPA associations. Touching those
  fields can fire extra queries or a LazyInitializationException, and a
  managed entity's identity should follow its id, not its mutable state.
  Use @Getter/@Setter, or scope @EqualsAndHashCode to the id.
rule:
  kind: class_declaration
  all:
    - has:
        kind: modifiers
        has:
          kind: marker_annotation
          has:
            field: name
            regex: "^Entity$"
    - has:
        kind: modifiers
        has:
          any:
            - kind: marker_annotation
              has:
                field: name
                regex: "^(Data|EqualsAndHashCode)$"
            - kind: annotation
              has:
                field: name
                regex: "^Data$"

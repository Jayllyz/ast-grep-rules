id: to-one-requires-lazy-fetch
language: java
severity: error
message: >-
  @ManyToOne/@OneToOne is missing an explicit fetch = FetchType.LAZY. The
  JPA spec defaults both to EAGER, so loading one entity can drag in the
  whole association graph and produce surprise joins. Set
  fetch = FetchType.LAZY and fetch explicitly where you need it.
rule:
  kind: field_declaration
  has:
    kind: modifiers
    has:
      any:
        - kind: marker_annotation
          has:
            field: name
            regex: "^(ManyToOne|OneToOne)$"
        - kind: annotation
          all:
            - has:
                field: name
                regex: "^(ManyToOne|OneToOne)$"
            - not:
                has:
                  field: arguments
                  has:
                    kind: element_value_pair
                    all:
                      - has:
                          field: key
                          regex: "^fetch$"
                      - has:
                          field: value
                          kind: field_access
                          all:
                            - has:
                                field: object
                                regex: "^FetchType$"
                            - has:
                                field: field
                                regex: "^LAZY$"

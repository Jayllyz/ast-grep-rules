id: no-save-in-loop
language: java
severity: warning
ignores:
  - "**/src/test/**"
  - "**/src/testFixtures/**"
  - "**/src/tests/**"
  - "**/*-tests/**"
  - "**/jmh-benchmarks/**"
  - "**/*testlib*/**"
  - "**/*Test.java"
  - "**/*Tests.java"
  - "**/*IT.java"
  - "**/*ITCase.java"
  - "**/*Benchmark.java"
message: >-
  Saving one entity per loop iteration issues an INSERT/UPDATE per row.
  Batch the writes with saveAll(...) or enable JDBC batching, otherwise
  the round trips dominate.
metadata:
  category: jpa
rule:
  any:
    - pattern: $R.save($X)
    - pattern: $R.saveAndFlush($X)
    - pattern: $R.persist($X)
    - pattern: $R.merge($X)
  inside:
    any:
      - kind: enhanced_for_statement
      - kind: for_statement
      - kind: while_statement
      - kind: do_statement
    stopBy: end
constraints:
  R:
    regex: "(?i)(.*(repository|repo|dao|entitymanager)$|(^|\\.)em$)"

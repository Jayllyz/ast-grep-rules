id: no-query-string-concatenation
language: java
severity: error
message: >-
  @Query is being built by concatenating strings, so the JPQL/SQL depends
  on runtime values. That's the classic opening for injection and it also
  prevents the provider from validating the query at startup. Use a
  constant query with named or positional parameters instead.
metadata:
  category: jpa
rule:
  kind: annotation
  all:
    - has:
        field: name
        regex: "^Query$"
    - has:
        field: arguments
        has:
          stopBy: end
          matches: runtime-concat
utils:
  # Literal-only concatenation is a compile-time constant, so only flag
  # a binary_expression with an operand that is not a literal or a nested
  # concatenation (nested ones are checked on their own).
  runtime-concat:
    kind: binary_expression
    has:
      any:
        - kind: identifier
        - kind: method_invocation
        - kind: field_access
        - kind: parenthesized_expression
        - kind: array_access
        - kind: ternary_expression

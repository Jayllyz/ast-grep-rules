id: entity-requires-table-name
language: java
severity: error
message: >-
  @Entity class is missing an explicit @Table(name = "...") annotation.
  Without it, Hibernate derives the table name from the class name using
  the active naming strategy, which silently breaks if that strategy ever
  changes or differs between environments.
metadata:
  category: jpa
rule:
  kind: class_declaration
  all:
    - has:
        kind: modifiers
        has:
          kind: marker_annotation
          has:
            field: name
            regex: "^Entity$"
    - not:
        has:
          kind: modifiers
          has:
            kind: annotation
            all:
              - has:
                  field: name
                  regex: "^Table$"
              - has:
                  field: arguments
                  has:
                    kind: element_value_pair
                    has:
                      field: key
                      regex: "^name$"

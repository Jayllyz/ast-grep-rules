id: prefer-isempty
language: java
severity: hint
message: >-
  Test for an empty String/collection with isEmpty() instead of
  size()/length()/equals(""). It reads better and avoids nil-vs-empty
  mixups when a field later switches between String and a collection.
rule:
  any:
    - pattern: "$X.size() == 0"
    - pattern: "$X.size() != 0"
    - pattern: "$X.size() > 0"
    - pattern: "$X.length() == 0"
    - pattern: "$X.length() != 0"
    - pattern: "$X.length() > 0"
    - pattern: "0 == $X.size()"
    - pattern: "0 != $X.size()"
    - pattern: "0 == $X.length()"
    - pattern: "0 != $X.length()"
    - pattern: '$X.equals("")'
    - pattern: '"".equals($X)'

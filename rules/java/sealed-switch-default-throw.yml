id: sealed-switch-default-throw
language: java
severity: warning
message: >-
  A pattern-matching switch with a default that throws is usually a sign
  the type being switched on should be sealed. With a sealed hierarchy,
  the compiler enforces exhaustiveness at compile time; this default
  branch is only a runtime safety net for a gap the compiler could have
  caught.
metadata:
  category: java
rule:
  kind: switch_rule
  all:
    - has:
        kind: switch_label
        regex: "^default$"
    - has:
        kind: throw_statement
        has:
          kind: object_creation_expression
          has:
            field: type
            regex: "^(IllegalStateException|UnsupportedOperationException|AssertionError)$"
  inside:
    kind: switch_block
    has:
      kind: switch_rule
      has:
        kind: switch_label
        has:
          kind: pattern
          has:
            kind: type_pattern

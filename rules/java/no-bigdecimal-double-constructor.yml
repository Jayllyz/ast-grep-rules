id: no-bigdecimal-double-constructor
language: java
severity: error
message: >-
  new BigDecimal(double) stores the exact binary floating-point value, not
  the decimal you wrote: new BigDecimal(0.1) is 0.1000000000000000055...
  Use BigDecimal.valueOf(double), which goes through the decimal string
  representation, or the String constructor.
metadata:
  category: java
rule:
  kind: object_creation_expression
  all:
    - has:
        field: type
        regex: "(^|\\.)BigDecimal$"
    - has:
        field: arguments
        has:
          kind: decimal_floating_point_literal

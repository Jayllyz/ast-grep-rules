id: no-optional-field-or-parameter
language: java
severity: warning
ignores:
  - "**/src/test/**"
  - "**/src/testFixtures/**"
  - "**/src/tests/**"
  - "**/*Test.java"
  - "**/*Tests.java"
  - "**/*IT.java"
  - "**/*ITCase.java"
message: >-
  Optional should only be used as a method return type, not as a field or
  parameter type. It isn't Serializable, and using it here just pushes an
  extra unwrap onto every caller instead of solving anything. Instead, keep
  the field/parameter as the raw type (mark it @Nullable if it may be
  absent) and only wrap it in Optional.ofNullable(...) at the accessor
  that returns it.
metadata:
  category: java
rule:
  all:
    - pattern:
        context: "Optional<$TYPE> x;"
        selector: generic_type
    - inside:
        any:
          - kind: field_declaration
          - kind: formal_parameter
        stopBy: end
    - not:
        inside:
          kind: class_declaration
          stopBy: end
          has:
            field: name
            regex: "^(Optional|Present|Absent)$"
fix: "$TYPE"

id: no-runtime-exec
language: java
severity: warning
message: >-
  Runtime.exec() takes a single string that gets split with a
  platform-dependent tokenizer and offers no control over the working
  directory, environment or I/O wiring. Use ProcessBuilder with an
  explicit argument list instead.
metadata:
  category: java
rule:
  pattern: Runtime.getRuntime().exec($$$ARGS)

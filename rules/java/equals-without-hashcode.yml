id: equals-without-hashcode
language: java
severity: error
ignores:
  - "**/src/test/**"
  - "**/src/testFixtures/**"
  - "**/src/tests/**"
  - "**/*-tests/**"
  - "**/jmh-benchmarks/**"
  - "**/*testlib*/**"
  - "**/*Test.java"
  - "**/*Tests.java"
  - "**/*IT.java"
  - "**/*ITCase.java"
  - "**/*Benchmark.java"
message: >-
  This class overrides equals() but not hashCode(), breaking the
  equals/hashCode contract: equal instances will usually get different hash
  codes, so HashMap/HashSet lookups can silently miss them. Add a matching
  hashCode(), or let Lombok generate both.
metadata:
  category: java
rule:
  kind: class_declaration
  all:
    - has:
        kind: method_declaration
        has:
          field: name
          regex: "^equals$"
        stopBy: end
    - not:
        has:
          kind: method_declaration
          has:
            field: name
            regex: "^hashCode$"
          stopBy: end

id: no-finalize-method
language: java
severity: warning
message: >-
  Object.finalize() is deprecated for removal: it may run long after the
  object is unreachable, or never at all, and exceptions thrown from it
  are ignored. Move cleanup to an explicit close(), try-with-resources or
  a Cleaner. (A method that opts in to the removal warning via
  @SuppressWarnings({"removal", "Finalize"|"deprecation"}) is left alone.)
metadata:
  category: java
rule:
  kind: method_declaration
  all:
    - has:
        field: name
        regex: "^finalize$"
    - has:
        field: parameters
        not:
          has:
            any:
              - kind: formal_parameter
              - kind: spread_parameter
    - not:
        has:
          kind: modifiers
          has:
            kind: annotation
            has:
              field: arguments
              has:
                kind: string_literal
                regex: "Finalize|deprecation|removal"
                stopBy: end

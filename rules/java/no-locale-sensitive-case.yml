id: no-locale-sensitive-case
language: java
severity: hint
ignores:
  - "**/src/test/**"
  - "**/src/testFixtures/**"
  - "**/src/tests/**"
  - "**/*-tests/**"
  - "**/jmh-benchmarks/**"
  - "**/*testlib*/**"
  - "**/*Test.java"
  - "**/*Tests.java"
  - "**/*IT.java"
  - "**/*ITCase.java"
  - "**/*Benchmark.java"
message: >-
  toLowerCase()/toUpperCase() without a Locale use the JVM default, so
  results vary by machine (in Turkish, "I".toLowerCase() is a dotless "ı").
  Pass Locale.ROOT, or the locale you actually mean, explicitly.
metadata:
  category: java
rule:
  any:
    - pattern: $S.toLowerCase()
    - pattern: $S.toUpperCase()

id: obvious-comment
language: java
severity: hint
message: >-
  Obvious comment — remove it, the code should speak for itself. Comments
  should explain WHY or document non-obvious constraints, not restate WHAT.
  If the code isn't clear, rename variables or extract a well-named method.
metadata:
  category: java
rule:
  any:
    - kind: line_comment
      regex: "(?i)^//\\s*(?:initialize|create|set\\s?up|handle|process|check\\s+(?:if|whether)|validate|update|return|gets?|store|add|increment|decrement|define|declare|assign|call|invoke|loop\\s+(?:through|over)|iterate\\s+(?:through|over)|import|export|render|fetch|send|remove|delete|destroy|free|reset|clear|toggle|convert|parse|format|calculate|compute|extract|merge|sort|filter|map|transform|append|prepend|push|pop|insert|set\\s+(?:the|\\w+\\s+to)|allocate|malloc|realloc)\\w*"
    - kind: block_comment
      regex: "(?i)^/\\*+\\s*(?:initialize|create|set\\s?up|handle|process|check\\s+(?:if|whether)|validate|update|return|gets?|store|add|increment|decrement|define|declare|assign|call|invoke|loop\\s+(?:through|over)|iterate\\s+(?:through|over)|import|export|render|fetch|send|remove|delete|destroy|free|reset|clear|toggle|convert|parse|format|calculate|compute|extract|merge|sort|filter|map|transform|append|prepend|push|pop|insert|set\\s+(?:the|\\w+\\s+to)|allocate|malloc|realloc)\\w*"

id: enumerated-requires-string
language: java
severity: error
message: >-
  @Enumerated is missing EnumType.STRING. The default is EnumType.ORDINAL,
  which persists the enum constant's declaration order as an integer and
  silently corrupts existing data the moment someone reorders, inserts,
  or removes an enum constant.
rule:
  kind: field_declaration
  has:
    kind: modifiers
    has:
      any:
        - kind: marker_annotation
          has:
            field: name
            regex: "^Enumerated$"
        - kind: annotation
          all:
            - has:
                field: name
                regex: "^Enumerated$"
            - not:
                has:
                  field: arguments
                  has:
                    any:
                      - kind: field_access
                        all:
                          - has:
                              field: object
                              regex: "^EnumType$"
                          - has:
                              field: field
                              regex: "^STRING$"
                      - kind: element_value_pair
                        has:
                          field: value
                          kind: field_access
                          all:
                            - has:
                                field: object
                                regex: "^EnumType$"
                            - has:
                                field: field
                                regex: "^STRING$"

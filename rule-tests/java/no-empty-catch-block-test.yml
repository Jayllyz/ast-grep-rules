id: no-empty-catch-block
valid:
  - |
    class Foo {
        void bar() {
            try {
                doThing();
            } catch (Exception e) {
                log.warn("failed", e);
            }
        }
    }
  - |
    class Foo {
        void bar() {
            try {
                doThing();
            } catch (UnsupportedOperationException ok) {
            }
        }
    }
  - |
    class Foo {
        void bar() {
            try {
                doThing();
            } catch (ClassCastException tolerated) {}
        }
    }
  - |
    class Foo {
        void bar() {
            try {
                doThing();
            } catch (NullPointerException expected) {}
        }
    }
  - |
    class Foo {
        void bar() {
            try {
                doThing();
            } catch (NullPointerException optional) {}
        }
    }
  - |
    class Foo {
        void bar() {
            try {
                doThing();
            } catch (Exception e) {
                // best-effort cleanup; nothing actionable here
            }
        }
    }
invalid:
  - |
    class Foo {
        void bar() {
            try {
                doThing();
            } catch (Exception e) {
            }
        }
    }
  - |
    class Foo {
        void bar() {
            try {
                doThing();
            } catch (Exception e) {}
        }
    }

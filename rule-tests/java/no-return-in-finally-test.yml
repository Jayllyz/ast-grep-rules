id: no-return-in-finally
valid:
  - |
    class Foo {
        int bar() {
            try {
                return compute();
            } catch (Exception e) {
                return -1;
            } finally {
                cleanup();
            }
        }
    }
  - |
    class Foo {
        void bar() {
            try {
                compute();
            } finally {
                cleanup();
            }
        }
    }
  - |
    class Foo {
        Runnable bar() {
            try {
                return pick();
            } finally {
                Runnable r = () -> {
                    return;
                };
            }
        }
    }
  - |
    class Foo {
        void bar() {
            try {
                compute();
            } finally {
                cleanup(new Runnable() {
                    public void run() {
                        return;
                    }
                });
            }
        }
    }
invalid:
  - |
    class Foo {
        int bar() {
            try {
                return compute();
            } finally {
                return -1;
            }
        }
    }
  - |
    class Foo {
        void bar() {
            try {
                compute();
            } catch (Exception e) {
                handle(e);
            } finally {
                throw new IllegalStateException(e);
            }
        }
    }
  - |
    class Foo {
        void bar(boolean flag) {
            try {
                compute();
            } finally {
                if (flag) {
                    return;
                }
            }
        }
    }
  - |
    class Foo {
        void bar(boolean flag) {
            try {
                compute();
            } finally {
                while (flag) {
                    if (flag) {
                        return;
                    }
                }
            }
        }
    }

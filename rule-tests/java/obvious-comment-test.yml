id: obvious-comment
valid:
  - |
    class Foo {
        // The retry count must account for clock skew, hence the +1.
        int retries = MAX_RETRIES + 1;
        // TODO: revisit once the cache layer lands.
        int cache = 0;
    }
  - |
    class Foo {
        /**
         * Returns the account balance. Overdrafts are represented as negative
         * values, so callers must not assume this is non-negative.
         */
        long balance() {
            return -1;
        }
    }
  - |
    class Foo {
        /* SAFETY: the array is copied defensively before publication. */
        void publish(byte[] data) {}
    }
  - |
    class Foo {
        // noinspection unchecked
        void raw() {}
    }
  - |
    class Foo {
        /** Returns the login name. */
        String getLogin() {
            return login;
        }
    }
  - |
    class Foo {
        // Iterate over the labels in reverse order (from top level domain to the left).
        for (String label : labels) {
            process(label);
        }
    }
  - |
    class Foo {
        // Returns the cached value when present, otherwise recomputes it.
        long value() {
            return 0;
        }
    }
  - |
    class Foo {
        // add a random number to avoid collisions with OrPredicate
        int salt = random();
    }
  - |
    class Foo {
        // Remove the group from the map as it is empty.
        groups.remove(group);
    }
  - |
    class Foo {
        // update the cached data based on the incoming request
        cache.update(request);
    }
invalid:
  - |
    class Foo {
        // initialize the counter
        int counter = 0;
    }
  - |
    class Foo {
        // Increment the counter
        counter++;
    }
  - |
    class Foo {
        // Set the name to the user's name
        this.name = user.name();
    }
  - |
    class Foo {
        // get the current user
        User u = repo.current();
    }
  - |
    class Foo {
        /* create a new connection */
        Connection c = open();
    }

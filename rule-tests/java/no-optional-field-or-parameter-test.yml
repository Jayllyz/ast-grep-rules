id: no-optional-field-or-parameter
valid:
  - |
    class Foo {
        Optional<String> name() {
            return Optional.empty();
        }
    }
  - |
    class Foo {
        private String name;
    }
  - |
    class Foo {
        void bar() {
            Optional<String> local = Optional.empty();
        }
    }
  - |
    final class Present<T> {
        private final Optional<T> reference;
        Present(Optional<T> reference) {
            this.reference = reference;
        }
    }
  - |
    final class Absent<T> {
        static final Absent<Object> INSTANCE = new Absent<>();
    }
invalid:
  - |
    class Foo {
        private Optional<String> name;
    }
  - |
    class Foo {
        void bar(Optional<String> name) {}
    }
  - |
    class Foo {
        void bar(String first, @Nullable Optional<String> name) {}
    }

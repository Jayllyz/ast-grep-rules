id: no-wildcard-import
valid:
  - |
    import java.util.List;
    class Foo {}
  - |
    import java.util.List;
    import java.util.Map;
    class Foo {}
invalid:
  - |
    import java.util.*;
    class Foo {}
  - |
    import static java.util.Collections.*;
    class Foo {}
  - |
    import static org.junit.jupiter.api.Assertions.*;
    class Foo {}

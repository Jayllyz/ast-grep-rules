id: no-optional-get
valid:
  - |
    class Foo {
        void bar(Optional<String> opt) {
            String s = opt.orElseThrow();
        }
    }
  - |
    class Foo {
        void bar(Optional<String> opt) {
            String s = opt.orElse("default");
        }
    }
  - |
    class Foo {
        void bar(Map<String, String> map) {
            String s = map.get("key");
        }
    }
  - |
    class Foo {
        void bar(CompletableFuture<String> future) {
            String s = future.get();
        }
    }
  - |
    class Foo {
        void bar(AtomicInteger counter, Supplier<String> supplier) {
            int n = counter.get();
            String s = supplier.get();
        }
    }
invalid:
  - |
    class Foo {
        void bar(Optional<String> opt) {
            String s = opt.get();
        }
    }
  - |
    class Foo {
        void bar(Optional<String> opt) {
            if (opt.get().isEmpty()) {
                return;
            }
        }
    }
  - |
    class Foo {
        void bar(List<String> names) {
            String first = names.stream().findFirst().get();
        }
    }
  - |
    class Foo {
        void bar() {
            String s = Optional.of("x").get();
        }
    }
  - |
    class Foo {
        private Optional<String> nameOpt;
        String bar() {
            return nameOpt.get();
        }
    }

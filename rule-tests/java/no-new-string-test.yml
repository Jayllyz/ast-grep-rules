id: no-new-string
valid:
  - |
    class Foo {
        void bar() {
            String s = "hello";
        }
    }
  - |
    class Foo {
        void bar(Object o) {
            String s = o.toString();
        }
    }
  - |
    class Foo {
        void bar(int i) {
            String s = String.valueOf(i);
        }
    }
  - |
    class Foo {
        void bar(byte[] bytes) {
            String s = new String(bytes);
        }
    }
  - |
    class Foo {
        void bar(byte[] bytes) {
            String s = new String(bytes, java.nio.charset.StandardCharsets.UTF_8);
        }
    }
  - |
    class Foo {
        void bar(char[] chars) {
            String s = new String(chars);
        }
    }
  - |
    class Foo {
        void bar(String suffix) {
            String s = new String("value=" + suffix);
        }
    }
invalid:
  - |
    class Foo {
        void bar() {
            String s = new String("hello");
        }
    }
  - |
    class Foo {
        void bar() {
            String s = new java.lang.String("hello");
        }
    }

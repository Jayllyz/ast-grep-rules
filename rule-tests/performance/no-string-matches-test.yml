id: no-string-matches
valid:
  - |
    class Foo {
        boolean bar(String s) {
            return PATTERN.matcher(s).matches();
        }
    }
  - |
    class Foo {
        String bar(String s) {
            return s.replace("old", "new");
        }
    }
  - |
    class Foo {
        String bar(String s) {
            return PATTERN.matcher(s).replaceAll("x");
        }
    }
  - |
    class Foo {
        boolean bar(CharMatcher matcher, char c) {
            return matcher.matches(c);
        }
    }
  - |
    class Foo {
        boolean bar(Validator validator, String value) {
            return validator.matches(value);
        }
    }
  - |
    class Foo {
        String bar(String s, String regex) {
            return s.replaceAll(regex, "");
        }
    }
invalid:
  - |
    class Foo {
        boolean bar(String s) {
            return s.matches("[0-9]+");
        }
    }
  - |
    class Foo {
        String bar(String s) {
            return s.replaceAll("[0-9]+", "");
        }
    }
  - |
    class Foo {
        String bar(String s) {
            return s.replaceFirst("[0-9]+", "");
        }
    }
  - |
    class Foo {
        String[] bar(String s) {
            return s.split(",");
        }
    }

id: or-else-eager-default
valid:
  - |
    class Foo {
        String bar(Optional<String> opt) {
            return opt.orElse("default");
        }
    }
  - |
    class Foo {
        String bar(Optional<String> opt, String ready) {
            return opt.orElse(ready);
        }
    }
  - |
    class Foo {
        String bar(Optional<String> opt) {
            return opt.orElseGet(() -> computeDefault());
        }
    }
  - |
    class Foo {
        String bar(Optional<String> opt) {
            return opt.orElseThrow();
        }
    }
  - |
    class Foo {
        String bar(Optional<String> opt) {
            return opt.orElse(computeDefault());
        }
    }
  - |
    class Foo {
        OptionalInt bar(Optional<String> opt) {
            return opt.orElse(OptionalInt.empty());
        }
    }
  - |
    class Foo {
        long bar(Optional<Long> opt) {
            return opt.orElse(clock.milliseconds());
        }
    }
invalid:
  - |
    class Foo {
        List<String> bar(Optional<List<String>> opt) {
            return opt.orElse(new ArrayList<>());
        }
    }
  - |
    class Foo {
        String bar(Optional<String> opt) {
            return opt.orElse(new String("default"));
        }
    }
  - |
    class Foo {
        Map<String, String> bar(Optional<Map<String, String>> opt) {
            return opt.orElse(new HashMap<>());
        }
    }

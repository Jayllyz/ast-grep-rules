id: parameterized-logging
valid:
  - |
    class Foo {
        void bar(String value) {
            log.debug("value={}", value);
        }
    }
  - |
    class Foo {
        void bar() {
            log.info("plain message");
        }
    }
  - |
    class Foo {
        void bar(Exception ex) {
            log.error("failed", ex);
        }
    }
  - |
    class Foo {
        void bar(int count, int total) {
            log.debug(count + total);
        }
    }
  - |
    class Foo {
        void bar(String value) {
            System.out.println("value=" + value);
        }
    }
  - |
    class Foo {
        void bar() {
            log.warn("{} Skipping check. "
                + "Set the flag to enable it.");
        }
    }
  - |
    class Foo {
        void bar() {
            log.error("misconfigured: "
                + "it should not run with this profile");
        }
    }
invalid:
  - |
    class Foo {
        void bar(String value) {
            log.debug("value=" + value);
        }
    }
  - |
    class Foo {
        void bar(int count) {
            logger.info("count=" + count);
        }
    }
  - |
    class Foo {
        void bar(int x, int y) {
            log.warn("x=" + x + " y=" + y);
        }
    }
  - |
    class Foo {
        void bar(Exception ex) {
            log.error("failed: " + ex.getMessage(), ex);
        }
    }
  - |
    class Foo {
        void bar(long id) {
            LOG.trace("id=" + id);
        }
    }

id: no-runtime-exec
valid:
  - |
    class Foo {
        Process bar() throws IOException {
            return new ProcessBuilder("ls", "-la").start();
        }
    }
invalid:
  - |
    class Foo {
        Process bar() throws IOException {
            return Runtime.getRuntime().exec("ls -la");
        }
    }
  - |
    class Foo {
        Process bar(String cmd) throws IOException {
            return Runtime.getRuntime().exec(cmd);
        }
    }

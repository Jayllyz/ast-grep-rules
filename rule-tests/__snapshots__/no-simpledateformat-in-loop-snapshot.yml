id: no-simpledateformat-in-loop
snapshots:
  ? |
    class Foo {
        void bar(List<Date> dates) {
            for (Date d : dates) {
                SimpleDateFormat fmt = new SimpleDateFormat("yyyy-MM-dd");
                use(fmt.format(d));
            }
        }
    }

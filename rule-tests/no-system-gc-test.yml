id: no-system-gc
valid:
  - |
    class Foo {
        void bar() {
            long t = System.currentTimeMillis();
        }
    }
  - |
    class Foo {
        void bar() {
            int cpus = Runtime.getRuntime().availableProcessors();
        }
    }
invalid:
  - |
    class Foo {
        void bar() {
            System.gc();
        }
    }
  - |
    class Foo {
        void bar() {
            Runtime.getRuntime().gc();
        }
    }

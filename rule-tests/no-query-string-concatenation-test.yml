id: no-query-string-concatenation
valid:
  - |
    interface OrderRepository {
        @Query("select o from Order o where o.id = :id")
        Order findOne(Long id);
    }
  - |
    interface OrderRepository {
        @Query(value = "select * from orders where id = ?1", nativeQuery = true)
        Order findOne(Long id);
    }
  - |
    interface OrderRepository {
        String FIND_ACTIVE = "select o from Order o where o.status = 'ACTIVE'";

        @Query(value = FIND_ACTIVE, nativeQuery = true)
        List<Order> findActive();
    }
invalid:
  - |
    interface OrderRepository {
        @Query("select o from Order o where o.status = " + STATUS)
        List<Order> find();
    }
  - |
    interface OrderRepository {
        @Query(value = "select * from orders where status = '" + status + "'", nativeQuery = true)
        List<Order> find(String status);
    }
  - |
    interface OrderRepository {
        @Query("select o from Order o where o." + FIELD + " = :value order by o." + ORDER)
        List<Order> find(String field, String order);
    }

id: criteria-requires-metamodel
valid:
  - |
    import jakarta.persistence.criteria.Root;
    class Foo {
        Predicate bar(Root<Order> root, CriteriaBuilder cb) {
            return cb.equal(root.get(Order_.status), "NEW");
        }
    }
  - |
    import jakarta.persistence.criteria.Root;
    class Foo {
        Object bar(Root<Order> root) {
            return root.join(Order_.items);
        }
    }

id: read-method-transactional-readonly
valid:
  - |
    class CustomerService {
        @Transactional(readOnly = true)
        List<Customer> findCustomers() {
            return repo.findAll();
        }
    }
  - |
    class CustomerService {
        @Transactional
        void save(Customer customer) {
            repo.save(customer);
        }
    }
  - |
    class CustomerService {
        List<Customer> findCustomers() {
            return repo.findAll();
        }
    }
invalid:

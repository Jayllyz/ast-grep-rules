    class CustomerService {
        @Transactional
        List<Customer> findCustomers() {
            return repo.findAll();
        }
    }
  - |
    class CustomerService {
        @Transactional
        Customer getById(Long id) {
            return repo.getById(id);
        }
    }
  - |
    class CustomerService {
        @Transactional
        long countActive() {
            return repo.count();
        }
    }
  - |
    class CustomerService {
        @Transactional
        boolean existsByEmail(String email) {
            return repo.existsByEmail(email);
        }

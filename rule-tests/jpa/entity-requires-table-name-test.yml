id: entity-requires-table-name
valid:
  - |
    @Entity
    @Table(name = "orders")
    class GoodEntity {
        @Id
        private Long id;
    }
  - |
    @Entity
    @Table(name = "orders", schema = "public")
    class GoodEntityWithSchema {
        @Id
        private Long id;
    }
  - |
    class PlainClass {
        private Long id;
    }
invalid:
  - |
    @Entity
    class MissingTableName {
        @Id
        private Long id;
    }
  - |
    @Entity
    @Table()
    class EmptyTableAnnotation {
        @Id
        private Long id;
    }
  - |
    @Entity
    @Table(schema = "public")
    class TableMissingName {
        @Id
        private Long id;
    }
  - |
    @Entity
    @Table
    class BareTableAnnotation {
        @Id
        private Long id;
    }

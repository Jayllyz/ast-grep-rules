id: no-save-in-loop
valid:
  - |
    class Foo {
        void bar(List<Order> orders) {
            repository.saveAll(orders);
        }
    }
  - |
    class Foo {
        void bar(List<Order> orders) {
            for (Order order : orders) {
                validate(order);
            }
            repository.save(orders.get(0));
        }
    }
  - |
    class Foo {
        void bar(List<Order> orders) {
            orders.forEach(repository::save);
        }
    }
  - |
    class Foo {
        void bar(List<Entry> entries) {
            for (Entry entry : entries) {
                map.merge(entry.key(), entry.value());
            }
        }
    }
  - |
    class Foo {
        void bar(List<Order> orders) {
            for (Order order : orders) {
                orderCache.put(order.id(), order);
            }
        }
    }
invalid:
  - |
    class Foo {
        void bar(List<Order> orders) {
            for (Order order : orders) {
                repository.save(order);
            }
        }
    }
  - |
    class Foo {
        void bar(List<Order> orders) {
            for (int i = 0; i < orders.size(); i++) {
                repository.saveAndFlush(orders.get(i));
            }
        }
    }
  - |
    class Foo {
        void bar(List<Order> orders) {
            for (Order order : orders) {
                entityManager.persist(order);
            }
        }
    }
  - |
    class Foo {
        void bar(List<Order> orders) {
            int i = 0;
            while (i < orders.size()) {
                entityManager.merge(orders.get(i++));
            }
        }
    }
